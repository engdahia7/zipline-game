name: Build Android App Bundle (.aab) & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB for Google Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Prepare Capacitor Android Platform
        run: |
          # If android directory does not exist, initialize Capacitor Android
          if [ ! -d "android" ]; then
            echo "Android directory not found in repository. Initializing Capacitor Android..."
            npx cap add android
          else
            echo "Android native directory is already present."
          fi

          # Ensure settings.gradle exists so Gradle knows the :app subproject
          if [ ! -f "android/settings.gradle" ]; then
            echo "Restoring settings.gradle into android/..."
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android settings.gradle 2>/dev/null || {
              echo "include ':app'" > android/settings.gradle
              echo "include ':capacitor-cordova-android-plugins'" >> android/settings.gradle
              echo "project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')" >> android/settings.gradle
              echo "apply from: 'capacitor.settings.gradle'" >> android/settings.gradle
            }
          fi

          # Ensure gradlew executable wrapper is available
          if [ ! -f "android/gradlew" ]; then
            echo "Restoring gradlew wrapper into android/..."
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradlew gradlew.bat 2>/dev/null || (cd android && gradle wrapper 2>/dev/null) || true
          fi
          chmod +x android/gradlew 2>/dev/null || true

          # Generate high-res Android & PWA icons
          if [ -f "./scripts/generate-android-icons.js" ]; then
            echo "Generating high-res custom ZipLine launcher & adaptive icons..."
            node ./scripts/generate-android-icons.js || true
          elif [ -f "./scripts/generate-icons.js" ]; then
            echo "Generating high-res icons for Android mipmap..."
            node ./scripts/generate-icons.js || true
          fi

          echo "Syncing Capacitor assets to Android..."
          npx cap sync android

      - name: Compute Dynamic Version & Build Android Bundle (.aab) and APK
        run: |
          # Automatically increment version code with every GitHub Actions build
          # Base offset is 1, so Run 1 -> Code 2, Run 2 -> Code 3, etc. (Guaranteed unique for Google Play)
          RUN_NUM=${{ github.run_number }}
          AUTO_VERSION_CODE=$(( RUN_NUM + 1 ))
          AUTO_VERSION_NAME="1.0.${AUTO_VERSION_CODE}"

          echo "=========================================================="
          echo "Building ZipLine Android App"
          echo "Version Code: $AUTO_VERSION_CODE"
          echo "Version Name: $AUTO_VERSION_NAME"
          echo "=========================================================="

          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PversionCode=$AUTO_VERSION_CODE \
            -PversionName=$AUTO_VERSION_NAME \
            --no-daemon --stacktrace

      - name: Prepare and Sign Release Files
        run: |
          mkdir -p release-output

          # Generate release keystore
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias zipline-key \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=ZipLine Game, OU=Mobile, O=ZipLine, L=Riyadh, ST=Riyadh, C=SA"

          # Sign AAB if found
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            AAB_FILE=$(find android/app/build/outputs -name "*release*.aab" 2>/dev/null | head -n 1)
          fi
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            AAB_FILE=$(find android -name "*.aab" 2>/dev/null | head -n 1)
          fi

          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            echo "Found AAB at: $AAB_FILE"
            echo "Signing $AAB_FILE..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release-key.jks \
              -storepass android123 \
              -keypass android123 \
              "$AAB_FILE" zipline-key
            cp "$AAB_FILE" release-output/zipline-game-release.aab
            echo "✓ AAB ready at release-output/zipline-game-release.aab"
          else
            echo "ERROR: AAB file was not generated"
            find android -name "*.aab" || true
            exit 1
          fi

          # Sign APK if found
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            echo "Signing $APK_FILE..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release-key.jks \
              -storepass android123 \
              -keypass android123 \
              "$APK_FILE" zipline-key || true
            cp "$APK_FILE" release-output/zipline-game-release.apk
            echo "✓ APK ready at release-output/zipline-game-release.apk"
          fi

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-ZipLine-AAB
          path: release-output/*.aab
          if-no-files-found: error

      - name: Upload Android APK Artifact (For direct device testing)
        uses: actions/upload-artifact@v4
        with:
          name: ZipLine-Test-APK
          path: release-output/*.apk
          if-no-files-found: warn
