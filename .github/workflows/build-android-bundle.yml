name: Build Android App Bundle (.aab) & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB for Google Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Node Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Prepare Capacitor Android Platform
        run: |
          # If android directory does not exist, initialize Capacitor Android
          if [ ! -d "android" ]; then
            echo "Android directory not found in repository. Initializing Capacitor Android..."
            npx cap add android
          else
            echo "Android native directory is already present."
          fi

          # Ensure gradlew executable wrapper is available
          if [ ! -f "android/gradlew" ]; then
            echo "Restoring gradlew wrapper into android/..."
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradlew gradlew.bat 2>/dev/null || (cd android && gradle wrapper 2>/dev/null) || true
          fi
          chmod +x android/gradlew 2>/dev/null || true

          # Adjust SDK versions if needed
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = 36/compileSdkVersion = 35/g' android/variables.gradle || true
            sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/g' android/variables.gradle || true
          fi

          # Generate high-res Android & PWA icons
          if [ -f "./scripts/generate-icons.js" ]; then
            echo "Generating high-res icons for Android mipmap..."
            node ./scripts/generate-icons.js || true
          fi

          echo "Syncing Capacitor assets to Android..."
          npx cap sync android

      - name: Build Android Bundle (.aab) and APK
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
          else
            echo "Using system gradle..."
            gradle bundleRelease assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare and Sign Release Files
        run: |
          mkdir -p release-output

          # Generate release keystore
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias zipline-key \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=ZipLine Game, OU=Mobile, O=ZipLine, L=Riyadh, ST=Riyadh, C=SA"

          # Sign AAB if found
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            echo "Signing $AAB_FILE..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release-key.jks \
              -storepass android123 \
              -keypass android123 \
              "$AAB_FILE" zipline-key
            cp "$AAB_FILE" release-output/zipline-game-release.aab
            echo "✓ AAB ready at release-output/zipline-game-release.aab"
          else
            echo "ERROR: AAB file was not generated"
            exit 1
          fi

          # Sign APK if found
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Signing $APK_FILE..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release-key.jks \
              -storepass android123 \
              -keypass android123 \
              "$APK_FILE" zipline-key || true
            cp "$APK_FILE" release-output/zipline-game-release.apk
            echo "✓ APK ready at release-output/zipline-game-release.apk"
          fi

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-ZipLine-AAB
          path: release-output/*.aab
          if-no-files-found: error

      - name: Upload Android APK Artifact (For direct device testing)
        uses: actions/upload-artifact@v4
        with:
          name: ZipLine-Test-APK
          path: release-output/*.apk
          if-no-files-found: warn
