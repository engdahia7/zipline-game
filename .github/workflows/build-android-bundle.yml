name: Build Android App Bundle (.aab)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB for Google Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Prepare Android Project & Build AAB
        run: |
          echo "Starting Android TWA App Bundle packaging..."
          mkdir -p android-build
          # Generate sample keystore if signing key is not provided in secrets
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=ZipLine, OU=Games, O=ZipLine, L=City, S=State, C=US"

          # Create twa-manifest.json
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.zipline.game.puzzle",
            "host": "zipline.game",
            "name": "ZipLine",
            "launcherName": "ZipLine",
            "display": "standalone",
            "themeColor": "#070B14",
            "navigationColor": "#070B14",
            "backgroundColor": "#070B14",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/public/pwa-512x512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/public/pwa-maskable-512x512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }
          EOF

          echo "Bubblewrap setup ready. Ready for gradlew bundleRelease"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipline-web-dist
          path: dist/
